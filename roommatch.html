<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>RoomMatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fb;--card:#fff;--tx:#14213d;--mu:#667085;--br:#e3e8ef;--ac:#0f766e;--ac2:#ccfbf1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e141b;--card:#18212b;--tx:#e8eef5;--mu:#93a1b3;--br:#2a3644;--ac:#2dd4bf;--ac2:#134e4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
nav{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--ac)}button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:.15s}.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.hero{padding:48px 20px;text-align:center;background:linear-gradient(135deg,var(--ac2),var(--bg))}
h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.hero p{color:var(--mu);max-width:560px;margin:0 auto 24px}
.sb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--card);padding:12px;border-radius:14px;max-width:900px;margin:auto;border:1px solid var(--br)}
.sb input,.sb select,.f input,.f select,.modal input,.modal select,.modal textarea{background:var(--bg);border:1px solid var(--br);border-radius:8px;padding:8px 10px;min-width:0}
main{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}
.ph{height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.cb{padding:12px}.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 2px 0 0}
.sc{position:absolute;top:8px;left:8px;background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.fav{position:absolute;top:6px;right:8px;background:var(--card);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:16px}.f label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.chip{border:1px solid var(--br);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mb{background:var(--card);border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:10}
.empty{text-align:center;padding:40px;color:var(--mu)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--br);text-align:left}
.tw{overflow-x:auto}
</style></head><body>
<nav><span class="logo">🏠 RoomMatch</span><div class="row" style="align-items:center"><button class="chip" id="tab-b" onclick="go('browse')">Find a Room</button><button class="chip" id="tab-s" onclick="go('saved')">Saved</button><button class="chip" id="tab-d" onclick="go('dash')">Dashboard</button><button class="btn o" onclick="toggleRole()" id="role"></button></div></nav>
<div id="app"></div><div id="m"></div>
<script>
const TT=['Students','Bachelors','Working Professionals','Families','Senior Citizens'],AM=['WiFi','Parking','AC','Kitchen','Washing Machine','Power Backup'];
const P=[
{id:1,t:'Sunrise Student Room near Campus',loc:'Benz Circle',city:'Vijayawada',rent:450,dep:900,type:'Room',fur:'Semi Furnished',for:['Students','Bachelors'],am:['WiFi','Power Backup'],av:'2026-10-15',e:'🎓',c:'#fde68a',st:'Available',d:'Walking distance to college, quiet study-friendly room.'},
{id:2,t:'Modern 1BHK for Professionals',loc:'Gunadala',city:'Vijayawada',rent:900,dep:1800,type:'1BHK',fur:'Fully Furnished',for:['Working Professionals'],am:['WiFi','AC','Kitchen','Parking'],av:'2026-10-20',e:'💼',c:'#bfdbfe',st:'Available',d:'Fully furnished, 10 min from IT park.'},
{id:3,t:'Spacious 2BHK Family Apartment',loc:'Patamata',city:'Vijayawada',rent:1300,dep:2600,type:'2BHK',fur:'Semi Furnished',for:['Families'],am:['Parking','Kitchen','Power Backup','Washing Machine'],av:'2026-11-01',e:'👨‍👩‍👧',c:'#bbf7d0',st:'Available',d:'Gated society, park and school nearby.'},
{id:4,t:'Shared Bachelor Pad',loc:'Labbipet',city:'Vijayawada',rent:350,dep:700,type:'Shared Room',fur:'Fully Furnished',for:['Bachelors','Students'],am:['WiFi','AC','Washing Machine'],av:'2026-10-10',e:'🛋️',c:'#fbcfe8',st:'Available',d:'3-person sharing, central location.'},
{id:5,t:'Senior-Friendly Ground Floor 1BHK',loc:'Moghalrajpuram',city:'Vijayawada',rent:750,dep:1500,type:'1BHK',fur:'Unfurnished',for:['Senior Citizens','Families'],am:['Power Backup','Kitchen'],av:'2026-10-25',e:'🌿',c:'#ddd6fe',st:'Available',d:'No stairs, near hospital and temple.'},
{id:6,t:'Compact 1RK Studio',loc:'Benz Circle',city:'Vijayawada',rent:550,dep:1100,type:'1RK',fur:'Fully Furnished',for:['Working Professionals','Students'],am:['WiFi','AC'],av:'2026-12-01',e:'🏙️',c:'#fed7aa',st:'Rented',d:'Currently rented; check back later.'}];
let S={view:'browse',role:'tenant',q:{loc:'',min:0,max:2000,tt:'Anyone'},f:{type:'',fur:'',am:[],sort:'rec'},favs:new Set(),inq:[],tp:{type:'1BHK',fur:'Semi Furnished',am:['WiFi']}};
const $=s=>document.querySelector(s),inr=n=>'$'+n.toLocaleString('en-US');
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function score(p){const q=S.q,r=[];let s=0;
 if(p.rent>=q.min&&p.rent<=q.max){s+=30;r.push('budget')}else if(p.rent<=q.max*1.15)s+=15;
 if(!q.loc||p.loc.toLowerCase().includes(q.loc.toLowerCase())||p.city.toLowerCase().includes(q.loc.toLowerCase())){s+=20;r.push('location')}
 if(q.tt==='Anyone'||p.for.includes(q.tt)){s+=20;r.push('tenant type')}
 const f=S.f.type||S.tp.type;if(p.type===f){s+=10;r.push('property type')}
 const req=S.f.am.length?S.f.am:S.tp.am;s+=10*(req.filter(a=>p.am.includes(a)).length/(req.length||1));if(req.every(a=>p.am.includes(a)))r.push('amenities');
 const fu=S.f.fur||S.tp.fur;if(p.fur===fu){s+=5;r.push('furnishing')}
 s+=5;return{n:Math.round(s),why:r.length?'Matches your '+r.join(', ')+'.':'Partial match — try adjusting your filters.'}}
function go(v){S.view=v;render()}
function toggleRole(){S.role=S.role==='tenant'?'owner':'tenant';toast('Switched to '+(S.role==='owner'?'Owner':'Tenant')+' account');S.view=S.role==='owner'?'dash':'browse';render()}
function filtered(){const q=S.q,f=S.f;let l=P.filter(p=>(!q.loc||(p.loc+p.city).toLowerCase().includes(q.loc.toLowerCase()))&&p.rent>=q.min&&p.rent<=q.max&&(q.tt==='Anyone'||p.for.includes(q.tt))&&(!f.type||p.type===f.type)&&(!f.fur||p.fur===f.fur)&&f.am.every(a=>p.am.includes(a)));
 l=l.map(p=>({...p,m:score(p)}));const so={rec:(a,b)=>b.m.n-a.m.n,lo:(a,b)=>a.rent-b.rent,hi:(a,b)=>b.rent-a.rent,new:(a,b)=>b.id-a.id};return l.sort(so[f.sort])}
function cardH(p){return`<div class="card"><div class="ph" style="background:${p.c}">${p.e}<span class="sc">${p.m.n}% Match</span><button class="fav" onclick="fav(${p.id})" aria-label="Save">${S.favs.has(p.id)?'❤️':'🤍'}</button></div><div class="cb"><b>${p.t}</b><div class="mu">📍 ${p.loc}, ${p.city}</div><div style="margin:6px 0"><b>${inr(p.rent)}</b>/mo <span class="mu">· Deposit ${inr(p.dep)}</span></div><div class="mu">${p.type} · Available ${p.av}</div><div>${p.for.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="mu" style="margin:6px 0">${p.am.slice(0,3).join(' · ')}</div><button class="btn" style="width:100%" onclick="detail(${p.id})">View Details</button></div></div>`}
function fav(id){S.favs.has(id)?(S.favs.delete(id),toast('Removed from saved')):(S.favs.add(id),toast('Saved ❤️'));render();}
function render(){['b','s','d'].forEach(k=>$('#tab-'+k).className='chip'+({b:'browse',s:'saved',d:'dash'}[k]===S.view?' on':''));
 $('#tab-b').style.display=$('#tab-s').style.display=S.role==='tenant'?'':'none';$('#role').textContent='Switch to '+(S.role==='tenant'?'Owner':'Tenant');
 const a=$('#app');
 if(S.view==='browse')a.innerHTML=browse();else if(S.view==='saved')a.innerHTML=saved();else a.innerHTML=S.role==='owner'?owner():tenant()}
function browse(){const q=S.q,f=S.f,l=filtered();
 return`<div class="hero"><h1>Find a place that fits your life.</h1><p>Discover rooms and homes based on your budget, lifestyle, and who you're looking to live with.</p>
 <div class="sb"><input id="ql" placeholder="Location" value="${q.loc}"><input id="qmin" type="number" min="0" placeholder="Min rent" value="${q.min||''}" style="width:110px"><input id="qmax" type="number" min="0" placeholder="Max rent" value="${q.max}" style="width:110px"><select id="qt">${['Anyone','Students','Families','Bachelors','Working Professionals','Senior Citizens'].map(t=>`<option ${t===q.tt?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="search()">Search</button></div></div>
 <main><div class="f"><div class="row"><label>Type<select id="ft" onchange="sf()"><option value="">Any</option>${['Room','Shared Room','1RK','1BHK','2BHK','3BHK+'].map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select></label><label>Furnishing<select id="ff" onchange="sf()"><option value="">Any</option>${['Fully Furnished','Semi Furnished','Unfurnished'].map(t=>`<option ${t===f.fur?'selected':''}>${t}</option>`).join('')}</select></label><label>Sort<select id="fs" onchange="sf()">${[['rec','Recommended'],['lo','Lowest Rent'],['hi','Highest Rent'],['new','Newest']].map(o=>`<option value="${o[0]}" ${o[0]===f.sort?'selected':''}>${o[1]}</option>`).join('')}</select></label></div><div style="margin-top:10px">${AM.map(x=>`<button class="chip ${f.am.includes(x)?'on':''}" onclick="ta('${x}')">${x}</button>`).join(' ')}</div></div>
 <div class="mu" style="margin-bottom:10px">${l.length} properties</div>${l.length?`<div class="grid">${l.map(cardH).join('')}</div>`:'<div class="empty"><div style="font-size:40px">🔍</div><b>No rooms match your filters.</b><br>Try increasing your budget or expanding your search area.</div>'}</main>`}
function search(){S.q={loc:$('#ql').value,min:+$('#qmin').value||0,max:+$('#qmax').value||1e9,tt:$('#qt').value};render()}
function sf(){S.f.type=$('#ft').value;S.f.fur=$('#ff').value;S.f.sort=$('#fs').value;render()}
function ta(x){const a=S.f.am;a.includes(x)?a.splice(a.indexOf(x),1):a.push(x);render()}
function saved(){const l=P.filter(p=>S.favs.has(p.id)).map(p=>({...p,m:score(p)}));
 return`<main><h2>Saved properties</h2>${l.length?`<div class="grid">${l.map(cardH).join('')}</div>`:'<div class="empty"><div style="font-size:40px">🤍</div><b>No saved properties yet.</b><br>Tap the heart on any listing to save it.</div>'}</main>`}
function detail(id){const p={...P.find(x=>x.id==id)};p.m=score(p);
 $('#m').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="mb"><div class="ph" style="background:${p.c};border-radius:12px;height:150px">${p.e}</div><h3 style="margin:0">${p.t}</h3><div class="mu">📍 ${p.loc}, ${p.city} · ${p.type} · ${p.fur}</div><div><span class="tag" style="font-size:14px">${p.m.n}% Match</span> <span class="mu">${p.m.why}</span></div><div><b>${inr(p.rent)}</b>/mo · Deposit ${inr(p.dep)}</div><p style="margin:0">${p.d}</p><div>${p.am.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="mu">Suitable for: ${p.for.join(', ')} · Available ${p.av}<br>🔒 Owner contact is private. Send an inquiry to connect.</div>
 ${p.st==='Rented'?'<div class="empty" style="padding:10px">This property is no longer available.</div>':''}
 <div class="row"><button class="btn o" onclick="fav(${p.id});detail(${p.id})">${S.favs.has(p.id)?'Remove':'Save'}</button>${p.st==='Available'?`<button class="btn" onclick="inquire(${p.id})">Send Inquiry</button>`:''}<button class="btn o" onclick="closeM()">Close</button></div></div></div>`}
function closeM(){$('#m').innerHTML=''}
function inquire(id){const p=P.find(x=>x.id==id);
 $('#m').innerHTML=`<div class="modal"><div class="mb"><h3 style="margin:0">Inquire: ${p.t}</h3><textarea id="im" rows="3" placeholder="Hi, I'm interested in this property…"></textarea><input id="id" type="date"><select id="ic"><option>Chat</option><option>Phone call</option><option>Email</option></select><div class="row"><button class="btn" onclick="sendInq(${id})">Send</button><button class="btn o" onclick="closeM()">Cancel</button></div></div></div>`}
function sendInq(id){const m=$('#im').value.trim(),d=$('#id').value;if(m.length<5||!d){toast('Add a message and move-in date');return}
 S.inq.push({id:Date.now(),pid:id,m,d,c:$('#ic').value,st:'Sent'});closeM();toast('Inquiry sent ✅');render()}
function tenant(){return`<main><h2>Tenant dashboard</h2><div class="f"><b>Profile & preferences</b><div class="row" style="margin-top:8px"><label>Property type<select onchange="S.tp.type=this.value">${['Room','Shared Room','1RK','1BHK','2BHK','3BHK+'].map(t=>`<option ${t===S.tp.type?'selected':''}>${t}</option>`).join('')}</select></label><label>Furnishing<select onchange="S.tp.fur=this.value">${['Fully Furnished','Semi Furnished','Unfurnished'].map(t=>`<option ${t===S.tp.fur?'selected':''}>${t}</option>`).join('')}</select></label></div></div>
 <h3>My inquiries</h3>${S.inq.length?`<div class="tw"><table><tr><th>Property</th><th>Move-in</th><th>Status</th></tr>${S.inq.map(i=>`<tr><td>${P.find(p=>p.id==i.pid).t}</td><td>${i.d}</td><td><span class="tag">${i.st}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">No inquiries yet.</div>'}</main>`}
function owner(){const av=P.filter(p=>p.st==='Available').length;
 return`<main><h2>Owner dashboard</h2><div class="grid" style="margin-bottom:20px">${[['Total listings',P.length],['Available',av],['Rented',P.length-av],['Inquiries',S.inq.length],['Saves',S.favs.size]].map(k=>`<div class="card cb"><div class="mu">${k[0]}</div><div style="font-size:28px;font-weight:700">${k[1]}</div></div>`).join('')}</div>
 <div class="row" style="justify-content:space-between"><h3>My properties</h3><button class="btn" onclick="addP()">+ Add Property</button></div><div class="tw"><table><tr><th>Title</th><th>Rent</th><th>Status</th><th></th></tr>${P.map(p=>`<tr><td>${p.t}</td><td>${inr(p.rent)}</td><td>${p.st}</td><td><button class="chip" onclick="tg(${p.id})">Mark ${p.st==='Available'?'Rented':'Available'}</button></td></tr>`).join('')}</table></div>
 <h3>Inquiries</h3>${S.inq.length?`<div class="tw"><table><tr><th>Property</th><th>Message</th><th>Move-in</th><th>Status</th></tr>${S.inq.map(i=>`<tr><td>${P.find(p=>p.id==i.pid).t}</td><td>${i.m}</td><td>${i.d}</td><td><select onchange="S.inq.find(x=>x.id==${i.id}).st=this.value;toast('Status updated')">${['Sent','Viewed','Responded','Closed'].map(s=>`<option ${s===i.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<div class="empty">No inquiries yet. Switch to a tenant account and send one!</div>'}</main>`}
function tg(id){const p=P.find(x=>x.id==id);p.st=p.st==='Available'?'Rented':'Available';render()}
function addP(){$('#m').innerHTML=`<div class="modal"><div class="mb"><h3 style="margin:0">Add property</h3><input id="at" placeholder="Title *"><input id="al" placeholder="Locality *"><input id="ar" type="number" min="1" placeholder="Monthly rent ($) *"><select id="ay">${['Room','Shared Room','1RK','1BHK','2BHK','3BHK+'].map(t=>`<option>${t}</option>`).join('')}</select><select id="aw">${TT.map(t=>`<option>${t}</option>`).join('')}</select><div class="row"><button class="btn" onclick="saveP()">Publish</button><button class="btn o" onclick="closeM()">Cancel</button></div></div></div>`}
function saveP(){const t=$('#at').value.trim(),l=$('#al').value.trim(),r=+$('#ar').value;if(!t||!l||!(r>0)){toast('Title, locality and a positive rent are required');return}
 P.push({id:P.length+1,t,loc:l,city:'Vijayawada',rent:r,dep:r*2,type:$('#ay').value,fur:'Semi Furnished',for:[$('#aw').value],am:['WiFi'],av:'2026-11-01',e:'🏡',c:'#e5e7eb',st:'Available',d:'New listing.'});closeM();toast('Property published');render()}
render();
</script></body></html>
