<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>RoomMatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fb;--card:#fff;--tx:#14213d;--mu:#667085;--br:#e3e8ef;--ac:#0f766e;--ac2:#ccfbf1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e141b;--card:#18212b;--tx:#e8eef5;--mu:#93a1b3;--br:#2a3644;--ac:#2dd4bf;--ac2:#134e4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
nav{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--ac)}button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:.15s}.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.hero{padding:44px 20px;text-align:center;background:linear-gradient(135deg,var(--ac2),var(--bg))}
h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.hero p{color:var(--mu);max-width:560px;margin:0 auto 24px}
.sb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--card);padding:12px;border-radius:14px;max-width:1000px;margin:auto;border:1px solid var(--br)}
.sb input,.sb select,.f select,.mb input,.mb select,.mb textarea{background:var(--bg);border:1px solid var(--br);border-radius:8px;padding:8px 10px;min-width:0}
main{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}
.ph{height:150px;position:relative;overflow:hidden;background:var(--br)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:12px}.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 2px 0 0}
.sc{position:absolute;top:8px;left:8px;background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.fav{position:absolute;top:6px;right:8px;background:var(--card);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:16px}.f label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.chip{border:1px solid var(--br);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mb{background:var(--card);border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:10px}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:6px}.gal .ph{height:110px;border-radius:10px}.gal .big{grid-row:span 2;height:226px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:10}
.empty{text-align:center;padding:40px;color:var(--mu)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--br);text-align:left}.tw{overflow-x:auto}
</style></head><body>
<nav><span class="logo">🏠 RoomMatch</span><div class="row" style="align-items:center"><span id="tabs" class="row"></span><button class="btn o" onclick="toggleRole()" id="role"></button></div></nav>
<div id="app"></div><div id="m"></div>
<script>
const TT=['Students','Singles','Working Professionals','Families','Seniors'],AM=['WiFi','Parking','AC','Kitchen','Washing Machine','Power Backup'],TY=['Room','Shared Room','Studio','1 Bedroom','2 Bedroom','3+ Bedroom'],FU=['Fully Furnished','Semi Furnished','Unfurnished'];
const G="Alabama|Birmingham,Montgomery;Alaska|Anchorage,Fairbanks;Arizona|Phoenix,Tucson;Arkansas|Little Rock,Fayetteville;California|Los Angeles,San Francisco;Colorado|Denver,Boulder;Connecticut|Hartford,New Haven;Delaware|Wilmington,Dover;District of Columbia|Washington;Florida|Miami,Orlando;Georgia|Atlanta,Savannah;Hawaii|Honolulu,Hilo;Idaho|Boise,Moscow;Illinois|Chicago,Champaign;Indiana|Indianapolis,Bloomington;Iowa|Des Moines,Iowa City;Kansas|Wichita,Lawrence;Kentucky|Louisville,Lexington;Louisiana|New Orleans,Baton Rouge;Maine|Portland,Bangor;Maryland|Baltimore,College Park;Massachusetts|Boston,Cambridge;Michigan|Detroit,Ann Arbor;Minnesota|Minneapolis,Saint Paul;Mississippi|Jackson,Oxford;Missouri|Kansas City,Saint Louis;Montana|Missoula,Bozeman;Nebraska|Omaha,Lincoln;Nevada|Las Vegas,Reno;New Hampshire|Manchester,Concord;New Jersey|Newark,Princeton;New Mexico|Albuquerque,Santa Fe;New York|New York City,Buffalo;North Carolina|Charlotte,Raleigh;North Dakota|Fargo,Grand Forks;Ohio|Columbus,Cleveland;Oklahoma|Oklahoma City,Tulsa;Oregon|Portland,Eugene;Pennsylvania|Philadelphia,Pittsburgh;Rhode Island|Providence,Newport;South Carolina|Charleston,Columbia;South Dakota|Sioux Falls,Rapid City;Tennessee|Nashville,Memphis;Texas|Austin,Houston;Utah|Salt Lake City,Provo;Vermont|Burlington,Montpelier;Virginia|Richmond,Charlottesville;Washington|Seattle,Spokane;West Virginia|Charleston,Morgantown;Wisconsin|Madison,Milwaukee;Wyoming|Cheyenne,Laramie";
const ST=G.split(';').map(x=>{const[a,b]=x.split('|');return[a,b.split(',')]});
const TP=[['Student Room near Campus','Room',['Students','Singles'],450,'Semi Furnished',['WiFi','Power Backup'],'Quiet room a short walk from campus.'],
['1 Bedroom for Professionals','1 Bedroom',['Working Professionals'],950,'Fully Furnished',['WiFi','AC','Kitchen','Parking'],'Furnished, close to offices and transit.'],
['Family Apartment','2 Bedroom',['Families'],1400,'Semi Furnished',['Parking','Kitchen','Washing Machine','Power Backup'],'Gated community near parks and schools.'],
['Shared Housing for Singles','Shared Room',['Singles','Students'],400,'Fully Furnished',['WiFi','AC','Washing Machine'],'Shared home with friendly roommates.'],
['Senior-Friendly Ground Floor','1 Bedroom',['Seniors','Families'],800,'Unfurnished',['Power Backup','Kitchen'],'No stairs, near clinics and shops.'],
['Cozy Studio','Studio',['Working Professionals','Students'],650,'Fully Furnished',['WiFi','AC'],'Bright studio with modern finishes.']];
const NB=['Downtown','Midtown','Uptown','Riverside','Oak Park','University District','Lakeview','Old Town'];
function rnd(seed){let s=(seed*7919+13)%2147483646+1;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const P=[];let n=0;ST.forEach(([s,cs])=>cs.forEach(c=>{for(let k=0;k<2;k++){const i=n++,t=TP[(i+Math.floor(i/6))%6],r=rnd(i+3),rent=Math.round(t[3]*(0.8+r()*0.9)/25)*25;
P.push({id:i+1,t:t[0]+' – '+c,loc:NB[Math.floor(r()*8)],city:c,state:s,rent,dep:rent,type:t[1],for:t[2],fur:t[4],am:t[5],d:t[6],av:'2026-'+(10+i%3)+'-'+(10+i*7%18),st:i%23===5?'Rented':'Available',o:i<6})}}));
const IC={};
function roomSVG(seed){const r=rnd(seed),pk=a=>a[Math.floor(r()*a.length)],w=pk(['#f2e8dc','#dbe7ee','#e6efe0','#f3dfe3','#ece6f5','#f7ecd0']),f=pk(['#b08968','#8d6e52','#c9a87c','#7a5c45']),c=pk(['#0f766e','#c2410c','#4f46e5','#be185d','#1d4ed8']),x=30+r()*120,sofa=r()>.5,bx=120+r()*80;
return`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240'><rect width='400' height='170' fill='${w}'/><rect y='170' width='400' height='70' fill='${f}'/><rect x='${x}' y='28' width='110' height='90' rx='4' fill='#9ad1f5' stroke='#fff' stroke-width='6'/><path d='M${x+55} 28v90M${x} 73h110' stroke='#fff' stroke-width='4'/><ellipse cx='${bx+85}' cy='205' rx='120' ry='20' fill='${c}' opacity='.25'/>${sofa?`<rect x='${bx}' y='115' width='170' height='60' rx='12' fill='${c}'/><rect x='${bx-10}' y='135' width='25' height='45' rx='8' fill='${c}'/><rect x='${bx+155}' y='135' width='25' height='45' rx='8' fill='${c}'/><rect x='${bx+20}' y='125' width='60' height='30' rx='6' fill='#fff' opacity='.5'/>`:`<rect x='${bx}' y='100' width='170' height='24' rx='6' fill='#6b4f3a'/><rect x='${bx}' y='128' width='170' height='45' rx='6' fill='${c}'/><rect x='${bx+10}' y='116' width='50' height='20' rx='8' fill='#fff'/><rect x='${bx+70}' y='116' width='50' height='20' rx='8' fill='#fff'/>`}<rect x='350' y='150' width='22' height='30' fill='#8b5e3c'/><circle cx='361' cy='135' r='22' fill='#3f8f5a'/><rect x='${bx-60}' y='125' width='4' height='55' fill='#444'/><circle cx='${bx-58}' cy='120' r='14' fill='#fde68a'/></svg>`}
function pic(p,k=0){const key=p.id+'_'+k;return IC[key]||(IC[key]='data:image/svg+xml,'+encodeURIComponent(roomSVG(p.id*10+k)))}
let S={view:'browse',role:'tenant',n:12,q:{s:'',c:'',min:0,max:3000,tt:'Anyone'},f:{type:'',fur:'',am:[],sort:'rec'},favs:new Set(),inq:[],tp:{type:'1 Bedroom',fur:'Semi Furnished',am:['WiFi']}};
const $=s=>document.querySelector(s),usd=n=>'$'+n.toLocaleString('en-US');
function save(){try{localStorage.setItem('rm',JSON.stringify({f:[...S.favs],i:S.inq}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('rm')||'{}');S.favs=new Set(d.f||[]);S.inq=d.i||[]}catch(e){}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
const inLoc=p=>(!S.q.s||p.state===S.q.s)&&(!S.q.c||p.city===S.q.c);
function score(p){const q=S.q,r=[];let s=0;
 if(p.rent>=q.min&&p.rent<=q.max){s+=30;r.push('budget')}else if(p.rent<=q.max*1.15)s+=15;
 if(inLoc(p)){s+=20;r.push('location')}
 if(q.tt==='Anyone'||p.for.includes(q.tt)){s+=20;r.push('tenant type')}
 if(p.type===(S.f.type||S.tp.type)){s+=10;r.push('property type')}
 const req=S.f.am.length?S.f.am:S.tp.am;s+=10*(req.filter(a=>p.am.includes(a)).length/(req.length||1));if(req.every(a=>p.am.includes(a)))r.push('amenities');
 if(p.fur===(S.f.fur||S.tp.fur)){s+=5;r.push('furnishing')}
 s+=5;return{n:Math.min(100,Math.round(s)),why:r.length?'Matches your '+r.join(', ')+'.':'Partial match — try adjusting your filters.'}}
function go(v){S.view=v;render()}
function toggleRole(){S.role=S.role==='tenant'?'owner':'tenant';toast('Switched to '+(S.role==='owner'?'Owner':'Tenant')+' account');S.view=S.role==='owner'?'dash':'browse';render()}
function filtered(){const q=S.q,f=S.f;let l=P.filter(p=>inLoc(p)&&p.rent>=q.min&&p.rent<=q.max&&(q.tt==='Anyone'||p.for.includes(q.tt))&&(!f.type||p.type===f.type)&&(!f.fur||p.fur===f.fur)&&f.am.every(a=>p.am.includes(a)));
 l=l.map(p=>({...p,m:score(p)}));const so={rec:(a,b)=>b.m.n-a.m.n,lo:(a,b)=>a.rent-b.rent,hi:(a,b)=>b.rent-a.rent,new:(a,b)=>b.id-a.id};return l.sort(so[f.sort])}
function cardH(p){return`<div class="card"><div class="ph"><img src="${pic(p)}" alt="${p.t}"><span class="sc">${p.m.n}% Match</span><button class="fav" onclick="fav(${p.id})" aria-label="Save">${S.favs.has(p.id)?'❤️':'🤍'}</button></div><div class="cb"><b>${p.t}</b><div class="mu">📍 ${p.loc}, ${p.city}, ${p.state}</div><div style="margin:6px 0"><b>${usd(p.rent)}</b>/mo <span class="mu">· Deposit ${usd(p.dep)}</span></div><div class="mu">${p.type} · ${p.fur} · Available ${p.av}</div><div>${p.for.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="mu" style="margin:6px 0">${p.am.slice(0,3).join(' · ')}</div><button class="btn" style="width:100%" onclick="detail(${p.id})">View Details</button></div></div>`}
function fav(id){S.favs.has(id)?(S.favs.delete(id),toast('Removed from saved')):(S.favs.add(id),toast('Saved ❤️'));save();render()}
function nav(){const t=S.role==='tenant'?[['browse','Find a Room'],['saved','Saved ('+S.favs.size+')'],['inq','Inquiries ('+S.inq.length+')'],['dash','Profile']]:[['dash','Dashboard'],['inq','Inquiries ('+S.inq.length+')']];
 $('#tabs').innerHTML=t.map(([v,l])=>`<button class="chip ${S.view===v?'on':''}" onclick="go('${v}')">${l}</button>`).join('');$('#role').textContent='Switch to '+(S.role==='tenant'?'Owner':'Tenant')}
function render(){nav();$('#app').innerHTML={browse,saved,inq,dash:S.role==='owner'?owner:tenant}[S.view]()}
function stOpts(sel){return'<option value="">All states</option>'+ST.map(x=>`<option ${x[0]===sel?'selected':''}>${x[0]}</option>`).join('')}
function cityOpts(s,sel){return'<option value="">Any city</option>'+((ST.find(x=>x[0]===s)||[0,[]])[1]).map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('')}
function stc(id){$(id||'#qc').innerHTML=cityOpts($(id?'#as':'#qs').value,'')}
function browse(){const q=S.q,f=S.f,l=filtered();
 return`<div class="hero"><h1>Find a place that fits your life.</h1><p>Discover rooms and homes across the USA based on your budget, lifestyle, and who you're looking to live with.</p>
 <div class="sb"><select id="qs" onchange="stc()">${stOpts(q.s)}</select><select id="qc">${cityOpts(q.s,q.c)}</select><input id="qmin" type="number" min="0" placeholder="Min rent" value="${q.min||''}" style="width:100px"><input id="qmax" type="number" min="0" placeholder="Max rent" value="${q.max}" style="width:100px"><select id="qt">${['Anyone',...TT].map(t=>`<option ${t===q.tt?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="search()">Search</button></div></div>
 <main><div class="f"><div class="row"><label>Type<select id="ft" onchange="sf()"><option value="">Any</option>${TY.map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select></label><label>Furnishing<select id="ff" onchange="sf()"><option value="">Any</option>${FU.map(t=>`<option ${t===f.fur?'selected':''}>${t}</option>`).join('')}</select></label><label>Sort<select id="fs" onchange="sf()">${[['rec','Recommended'],['lo','Lowest Rent'],['hi','Highest Rent'],['new','Newest']].map(o=>`<option value="${o[0]}" ${o[0]===f.sort?'selected':''}>${o[1]}</option>`).join('')}</select></label></div><div style="margin-top:10px">${AM.map(x=>`<button class="chip ${f.am.includes(x)?'on':''}" onclick="ta('${x}')">${x}</button>`).join(' ')}</div></div>
 <div class="mu" style="margin-bottom:10px">${l.length} properties${q.s?' in '+(q.c?q.c+', ':'')+q.s:' across the USA'}</div>${l.length?`<div class="grid">${l.slice(0,S.n).map(cardH).join('')}</div>${l.length>S.n?'<div style="text-align:center;margin-top:20px"><button class="btn o" onclick="S.n+=12;render()">Show more</button></div>':''}`:'<div class="empty"><div style="font-size:40px">🔍</div><b>No rooms match your filters.</b><br>Try increasing your budget or expanding your search area.</div>'}</main>`}
function search(){S.q={s:$('#qs').value,c:$('#qc').value,min:+$('#qmin').value||0,max:+$('#qmax').value||1e9,tt:$('#qt').value};S.n=12;render()}
function sf(){S.f.type=$('#ft').value;S.f.fur=$('#ff').value;S.f.sort=$('#fs').value;S.n=12;render()}
function ta(x){const a=S.f.am;a.includes(x)?a.splice(a.indexOf(x),1):a.push(x);S.n=12;render()}
function saved(){const l=P.filter(p=>S.favs.has(p.id)).map(p=>({...p,m:score(p)}));
 return`<main><h2>Saved properties</h2>${l.length?`<div class="grid">${l.map(cardH).join('')}</div>`:'<div class="empty"><div style="font-size:40px">🤍</div><b>No saved properties yet.</b><br>Tap the heart on any listing to save it.</div>'}</main>`}
function detail(id){const p={...P.find(x=>x.id==id)};p.m=score(p);
 $('#m').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="mb"><div class="gal"><div class="ph big"><img src="${pic(p,0)}"></div><div class="ph"><img src="${pic(p,1)}"></div><div class="ph"><img src="${pic(p,2)}"></div></div><h3 style="margin:0">${p.t}</h3><div class="mu">📍 ${p.loc}, ${p.city}, ${p.state} · ${p.type} · ${p.fur}</div><div><span class="tag" style="font-size:14px">${p.m.n}% Match</span> <span class="mu">${p.m.why}</span></div><div><b>${usd(p.rent)}</b>/mo · Deposit ${usd(p.dep)}</div><p style="margin:0">${p.d}</p><div>${p.am.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="mu">Suitable for: ${p.for.join(', ')} · Available ${p.av}<br>🔒 Owner contact is private. Send an inquiry to connect.</div>
 ${p.st==='Rented'?'<div class="empty" style="padding:10px">This property is no longer available.</div>':''}
 <div class="row"><button class="btn o" onclick="fav(${p.id});detail(${p.id})">${S.favs.has(p.id)?'Remove':'Save'}</button>${p.st==='Available'?`<button class="btn" onclick="inquire(${p.id})">Send Inquiry</button>`:''}<button class="btn o" onclick="closeM()">Close</button></div></div></div>`}
function closeM(){$('#m').innerHTML=''}
function inquire(id){const p=P.find(x=>x.id==id);
 $('#m').innerHTML=`<div class="modal"><div class="mb"><h3 style="margin:0">Inquire: ${p.t}</h3><textarea id="im" rows="3" placeholder="Hi, I'm interested in this property…"></textarea><input id="id" type="date"><select id="ic"><option>Chat</option><option>Phone call</option><option>Email</option></select><div class="row"><button class="btn" onclick="sendInq(${id})">Send</button><button class="btn o" onclick="closeM()">Cancel</button></div></div></div>`}
function sendInq(id){const m=$('#im').value.trim(),d=$('#id').value;if(m.length<5||!d){toast('Add a message and move-in date');return}
 S.inq.push({id:Date.now(),pid:id,m,d,c:$('#ic').value,st:'Sent'});save();closeM();toast('Inquiry sent ✅');S.view='inq';render();scrollTo(0,0)}
function inq(){const own=S.role==='owner',pt=i=>(P.find(p=>p.id==i.pid)||{}).t;
 return`<main><h2>${own?'Inquiries received':'My inquiries'}</h2>${S.inq.length?`<div class="tw"><table><tr><th>Property</th><th>Message</th><th>Move-in</th><th>Contact via</th><th>Status</th></tr>${S.inq.map(i=>`<tr><td>${pt(i)}</td><td>${i.m}</td><td>${i.d}</td><td>${i.c}</td><td>${own?`<select onchange="S.inq.find(x=>x.id==${i.id}).st=this.value;save();toast('Status updated')">${['Sent','Viewed','Responded','Closed'].map(s=>`<option ${s===i.st?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="tag">${i.st}</span>`}</td></tr>`).join('')}</table></div>`:`<div class="empty"><div style="font-size:40px">📭</div><b>No inquiries yet.</b><br>${own?'Switch to a tenant account and send one.':'Open a property and tap Send Inquiry.'}</div>`}</main>`}
function tenant(){return`<main><h2>Profile & preferences</h2><div class="f"><div class="row"><label>Property type<select onchange="S.tp.type=this.value">${TY.map(t=>`<option ${t===S.tp.type?'selected':''}>${t}</option>`).join('')}</select></label><label>Furnishing<select onchange="S.tp.fur=this.value">${FU.map(t=>`<option ${t===S.tp.fur?'selected':''}>${t}</option>`).join('')}</select></label></div><p class="mu">These preferences feed your RoomMatch Score.</p></div></main>`}
function owner(){const my=P.filter(p=>p.o),av=my.filter(p=>p.st==='Available').length;
 return`<main><h2>Owner dashboard</h2><div class="grid" style="margin-bottom:20px">${[['Total listings',my.length],['Available',av],['Rented',my.length-av],['Inquiries',S.inq.length],['Saves',S.favs.size]].map(k=>`<div class="card cb"><div class="mu">${k[0]}</div><div style="font-size:28px;font-weight:700">${k[1]}</div></div>`).join('')}</div>
 <div class="row" style="justify-content:space-between"><h3>My properties</h3><button class="btn" onclick="addP()">+ Add Property</button></div><div class="tw"><table><tr><th>Title</th><th>Rent</th><th>Status</th><th></th></tr>${my.map(p=>`<tr><td>${p.t}<div class="mu">${p.city}, ${p.state}</div></td><td>${usd(p.rent)}</td><td>${p.st}</td><td><button class="chip" onclick="tg(${p.id})">Mark ${p.st==='Available'?'Rented':'Available'}</button></td></tr>`).join('')}</table></div></main>`}
function tg(id){const p=P.find(x=>x.id==id);p.st=p.st==='Available'?'Rented':'Available';render()}
function addP(){$('#m').innerHTML=`<div class="modal"><div class="mb"><h3 style="margin:0">Add property</h3><input id="at" placeholder="Title *"><select id="as" onchange="stc('#ac')">${stOpts('')}</select><select id="ac">${cityOpts('','')}</select><input id="al" placeholder="Neighborhood *"><input id="ar" type="number" min="1" placeholder="Monthly rent ($) *"><select id="ay">${TY.map(t=>`<option>${t}</option>`).join('')}</select><select id="aw">${TT.map(t=>`<option>${t}</option>`).join('')}</select><div class="row"><button class="btn" onclick="saveP()">Publish</button><button class="btn o" onclick="closeM()">Cancel</button></div></div></div>`}
function saveP(){const t=$('#at').value.trim(),l=$('#al').value.trim(),r=+$('#ar').value,s=$('#as').value,c=$('#ac').value;if(!t||!l||!s||!c||!(r>0)){toast('Title, state, city, neighborhood and a positive rent are required');return}
 P.push({id:P.length+1,t,loc:l,city:c,state:s,rent:r,dep:r,type:$('#ay').value,fur:'Semi Furnished',for:[$('#aw').value],am:['WiFi'],av:'2026-11-01',st:'Available',d:'New listing.',o:true});closeM();toast('Property published');render()}
render();
</script></body></html>
